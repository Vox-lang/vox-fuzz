name: vox-fuzz - Build + tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The job is named `build` because that is the status-check name the
  # branch ruleset requires — the same convention as the vox and
  # vox-libs repos.
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install NASM
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Check out the Vox compiler
        uses: actions/checkout@v4
        with:
          repository: Vox-lang/vox
          path: vox

      - name: Build the Vox compiler
        working-directory: vox
        run: cargo build --release

      # VOX and VOX_CORE_PATH are passed explicitly rather than derived:
      # vox falls through a bad VOX_CORE_PATH silently to any installed
      # copy, and test.sh refuses to run when the directory is missing.
      - name: Build vox-fuzz
        run: |
          VOX="$GITHUB_WORKSPACE/vox/target/release/vox" \
          VOX_CORE_PATH="$GITHUB_WORKSPACE/vox/coreasm" \
          make build

      - name: Run the test suite (deterministic gate; soak tests are local-only)
        run: |
          VOX="$GITHUB_WORKSPACE/vox/target/release/vox" \
          VOX_CORE_PATH="$GITHUB_WORKSPACE/vox/coreasm" \
          VOX_FUZZ_CI=1 \
          ./test.sh

      # Smoke fuzz removed 2026-08-19: a fuzzer answers "does a bug exist
      # somewhere", which is the wrong question for a gate. A finding from
      # seed 47 would fail the PR of whoever pushed a README typo, for a bug
      # that is not theirs and may be months old — a stochastic gate blocks
      # the wrong person and so loses its authority. Exploratory fuzzing is a
      # local campaign instead; see SEEDS.md for how to run one. The
      # deterministic gate that replaces it is tests/220_determinism.vox
      # (generation is reproducible from its seed) plus the per-function unit
      # tests in tests/230_units.vox.
